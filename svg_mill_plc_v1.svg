<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f1f5f9; }
      .gpu-layer { will-change: transform, opacity; transform: translateZ(0); }
      
      @keyframes boltRiseUp {
        0% { transform: translateY(80px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateY(-80px); opacity: 0; }
      }
      .bolt-r1 { animation: boltRiseUp 3.2s linear infinite; }
      .bolt-r2 { animation: boltRiseUp 3.2s linear infinite -0.4s; }
      .bolt-r3 { animation: boltRiseUp 3.2s linear infinite -0.8s; }
      .bolt-r4 { animation: boltRiseUp 3.2s linear infinite -1.2s; }
      .bolt-r5 { animation: boltRiseUp 3.2s linear infinite -1.6s; }
      .bolt-r6 { animation: boltRiseUp 3.2s linear infinite -2.0s; }
      .bolt-r7 { animation: boltRiseUp 3.2s linear infinite -2.4s; }
      .bolt-r8 { animation: boltRiseUp 3.2s linear infinite -2.8s; }

      @keyframes gearTeethUp {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-30px); }
      }
      .gear-teeth-up { animation: gearTeethUp 0.35s linear infinite; }

      @keyframes gearTeethDown {
        0% { transform: translateY(-30px); }
        100% { transform: translateY(0px); }
      }
      .gear-teeth-down { animation: gearTeethDown 0.35s linear infinite; }

      @keyframes ledPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .led-active { animation: ledPulse 2s ease-in-out infinite; }
    </style>

    <linearGradient id="metalBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="cylinderGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <linearGradient id="cylinderRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="30%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="gearGoldCel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="motorBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="30%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="reducerGrey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="20%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="shaftChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <radialGradient id="boltGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <pattern id="gearTeethPattern" width="35" height="30" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="35" height="15" fill="#0f172a"/>
      <rect x="2" y="15" width="31" height="13" fill="url(#gearGoldCel)" rx="2"/>
      <rect x="5" y="17" width="25" height="3" fill="#ffffff" opacity="0.6"/>
    </pattern>

    <clipPath id="cylinderClip">
      <rect x="420" y="180" width="440" height="160" rx="2"/>
    </clipPath>

    <clipPath id="gearMajorClip">
      <rect x="375" y="150" width="35" height="200" rx="2"/>
    </clipPath>

    <clipPath id="gearPinionClip">
      <rect x="375" y="348" width="35" height="65" rx="2"/>
    </clipPath>

    <g id="boltRowGroup">
      <circle cx="440" cy="260" r="4.5" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="0.5"/>
      <circle cx="480" cy="260" r="4.5" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="0.5"/>
      <circle cx="520" cy="260" r="4.5" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="0.5"/>
      <circle cx="560" cy="260" r="4.5" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="0.5"/>
      <circle cx="600" cy="260" r="4.5" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="0.5"/>
      <circle cx="640" cy="260" r="4.5" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="0.5"/>
      <circle cx="680" cy="260" r="4.5" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="0.5"/>
      <circle cx="720" cy="260" r="4.5" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="0.5"/>
      <circle cx="760" cy="260" r="4.5" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="0.5"/>
      <circle cx="800" cy="260" r="4.5" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="0.5"/>
      <circle cx="840" cy="260" r="4.5" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="0.5"/>
    </g>

    <filter id="softShadowLight" x="-5%" y="-5%" width="115%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="3" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect class="bg" width="1000" height="600"/>
  <path d="M 0,460 L 1000,460 M 0,500 L 1000,500" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8,4"/>

  <g filter="url(#softShadowLight)">
    <rect x="40" y="450" width="920" height="25" rx="3" fill="#cbd5e1" stroke="#94a3b8"/>
    <rect x="40" y="450" width="920" height="3" fill="#ffffff"/>
    
    <path d="M 50,410 L 65,450 H 325 L 340,410 Z" fill="url(#reducerGrey)" stroke="#475569" stroke-width="0.8"/>
    <path d="M 345,410 L 355,450 H 405 L 415,410 Z" fill="url(#reducerGrey)" stroke="#475569" stroke-width="0.8"/>
    <path d="M 320,330 L 335,450 H 385 L 400,330 Z" fill="url(#metalBody)" stroke="#334155" stroke-width="1"/>
    <path d="M 850,330 L 865,450 H 915 L 930,330 Z" fill="url(#metalBody)" stroke="#334155" stroke-width="1"/>

    <g id="electricMotor">
      <rect x="60" y="352" width="90" height="56" rx="5" fill="url(#motorBlue)" stroke="#1d4ed8" stroke-width="1"/>
      <path d="M 70,352 V 408 M 80,352 V 408 M 90,352 V 408 M 100,352 V 408 M 110,352 V 408 M 120,352 V 408 M 130,352 V 408" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
      <rect x="52" y="355" width="10" height="50" rx="2" fill="#334155"/>
      <rect x="85" y="340" width="30" height="13" rx="2" fill="url(#motorBlue)" stroke="#93c5fd" stroke-width="1"/>
      <circle cx="130" cy="360" r="4" fill="#22c55e" class="led-active"/>
    </g>

    <rect x="150" y="375" width="40" height="10" fill="url(#shaftChrome)" stroke="#475569" stroke-width="0.8"/>
    <rect x="165" y="370" width="10" height="20" rx="1" fill="#334155"/>

    <g id="gearbox">
      <path d="M 190,335 H 280 L 295,360 V 410 H 190 Z" fill="url(#reducerGrey)" stroke="#334155" stroke-width="1.2"/>
      <rect x="190" y="335" width="105" height="3" fill="#ffffff"/>
      <rect x="205" y="328" width="50" height="8" rx="1" fill="#475569" stroke="#64748b" stroke-width="1"/>
      <circle cx="270" cy="380" r="12" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="210" cy="390" r="4" fill="#facc15" stroke="#475569" stroke-width="1"/>
    </g>

    <rect x="295" y="375" width="80" height="10" fill="url(#shaftChrome)" stroke="#475569" stroke-width="0.8"/>
    
    <g id="pinionPillowBlock">
      <path d="M 330,410 L 338,370 H 362 L 370,410 Z" fill="url(#metalBody)" stroke="#334155" stroke-width="1"/>
      <rect x="333" y="367" width="34" height="8" rx="1" fill="#475569" stroke="#94a3b8" stroke-width="0.8"/>
      <circle cx="340" cy="402" r="2" fill="#ffffff"/>
      <circle cx="360" cy="402" r="2" fill="#ffffff"/>
    </g>

    <!-- PIÑÓN (Dientes BAJAN) -->
    <rect x="375" y="348" width="35" height="65" rx="2" fill="url(#gearGoldCel)" stroke="#0f172a" stroke-width="2"/>
    <g clip-path="url(#gearPinionClip)">
      <g class="gear-teeth-down gpu-layer">
        <rect x="375" y="320" width="35" height="120" fill="url(#gearTeethPattern)"/>
      </g>
    </g>

    <!-- CORONA (Dientes SUBEN) - COLOR DORADO DIFERENCIADO -->
    <rect x="375" y="150" width="35" height="200" rx="2" fill="url(#gearGoldCel)" stroke="#0f172a" stroke-width="2"/>
    <g clip-path="url(#gearMajorClip)">
      <g class="gear-teeth-up gpu-layer">
        <rect x="375" y="120" width="35" height="260" fill="url(#gearTeethPattern)"/>
      </g>
    </g>

    <rect x="373" y="345" width="39" height="5" fill="#0f172a" opacity="0.6" rx="1"/>

    <g id="leftBearingSupport">
      <path d="M 330,240 L 365,248 V 272 L 330,280 Z" fill="url(#shaftChrome)" stroke="#334155" stroke-width="1"/>
      <rect x="338" y="235" width="32" height="50" rx="3" fill="url(#reducerGrey)" stroke="#334155" stroke-width="1.2"/>
      <line x1="338" y1="260" x2="370" y2="260" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="344" cy="242" r="2" fill="#ffffff"/><circle cx="364" cy="242" r="2" fill="#ffffff"/>
      <circle cx="344" cy="278" r="2" fill="#ffffff"/><circle cx="364" cy="278" r="2" fill="#ffffff"/>
    </g>

    <g id="rightBearingSupport">
      <path d="M 865,248 L 900,240 V 280 L 865,272 Z" fill="url(#shaftChrome)" stroke="#334155" stroke-width="1"/>
      <rect x="865" y="235" width="32" height="50" rx="3" fill="url(#reducerGrey)" stroke="#334155" stroke-width="1.2"/>
      <line x1="865" y1="260" x2="897" y2="260" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="871" cy="242" r="2" fill="#ffffff"/><circle cx="891" cy="242" r="2" fill="#ffffff"/>
      <circle cx="871" cy="278" r="2" fill="#ffffff"/><circle cx="891" cy="278" r="2" fill="#ffffff"/>
    </g>

    <g id="mainCylinderGroup">
      <rect id="molino-body" x="420" y="180" width="440" height="160" rx="3" fill="url(#cylinderGreen)" stroke="#475569" stroke-width="1.2"/>
      <rect x="410" y="180" width="10" height="160" fill="url(#metalBody)" rx="2"/>
      <rect x="860" y="180" width="10" height="160" fill="url(#metalBody)" rx="2"/>

      <g id="pernos" clip-path="url(#cylinderClip)">
        <use href="#boltRowGroup" class="bolt-r1 gpu-layer"/>
        <use href="#boltRowGroup" class="bolt-r2 gpu-layer"/>
        <use href="#boltRowGroup" class="bolt-r3 gpu-layer"/>
        <use href="#boltRowGroup" class="bolt-r4 gpu-layer"/>
        <use href="#boltRowGroup" class="bolt-r5 gpu-layer"/>
        <use href="#boltRowGroup" class="bolt-r6 gpu-layer"/>
        <use href="#boltRowGroup" class="bolt-r7 gpu-layer"/>
        <use href="#boltRowGroup" class="bolt-r8 gpu-layer"/>
      </g>

      <rect x="420" y="180" width="440" height="20" fill="#ffffff" opacity="0.6" clip-path="url(#cylinderClip)"/>
      <rect x="420" y="305" width="440" height="35" fill="#334155" opacity="0.25" clip-path="url(#cylinderClip)"/>
    </g>

    <!-- INDICADOR DE TONELAJE - MINIMALISTA MODERNO -->
    <g transform="translate(750, 80)">
      <!-- Contenedor con fondo sutil -->
      <rect x="-60" y="-35" width="120" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#softShadowLight)"/>
      
      <!-- Número grande y moderno - SIN TÍTULO -->
      <text x="0" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
            font-size="42" font-weight="800" fill="#059669"
            style="filter: drop-shadow(0px 2px 4px rgba(5, 150, 105, 0.2));"
            inkscape:label="{&quot;attr&quot;:&quot;get&quot;,&quot;tag&quot;:&quot;@1&quot;,&quot;type&quot;:&quot;Good&quot;}" 
            xml:space="preserve">
        <tspan x="0" y="15">--.-</tspan>
      </text>
      
      <!-- Unidad pequeña -->
      <text x="0" y="28" text-anchor="middle" font-family="system-ui, sans-serif" 
            font-size="12" font-weight="500" fill="#94a3b8">
        t/h
      </text>
    </g>
  </g>

  <!-- SCRIPT DE CAMBIO DE COLOR -->
  <rect x="0" y="0" width="0" height="0"
        inkscape:label="{&quot;attr&quot;:&quot;set&quot;,&quot;src&quot;:&quot;var t = $V(\&quot;@1\&quot;); var body = d3.select(\&quot;#molino-body\&quot;); var pernos = d3.select(\&quot;#pernos\&quot;); if (t &gt; 0) { body.style(\&quot;fill\&quot;, \&quot;url(#cylinderGreen)\&quot;); pernos.style(\&quot;display\&quot;, \&quot;block\&quot;); } else { body.style(\&quot;fill\&quot;, \&quot;url(#cylinderRed)\&quot;); pernos.style(\&quot;display\&quot;, \&quot;none\&quot;); }&quot;,&quot;tag&quot;:&quot;#exec_on_update&quot;,&quot;type&quot;:&quot;Data&quot;}"/>
</svg>