<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns:dc="http://purl.org/dc/elements/1.1/" 
     xmlns:cc="http://creativecommons.org/ns#" 
     xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" 
     xmlns:svg="http://www.w3.org/2000/svg" 
     xmlns="http://www.w3.org/2000/svg" 
     xmlns:xlink="http://www.w3.org/1999/xlink" 
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" 
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" 
     viewBox="0 0 1200 600" 
     width="100%" 
     height="100%" 
     version="1.1" 
     id="motor_electrico_caja">
  <defs>
    <style>
      .chumacera-izq { fill: #22c55e; }
      .chumacera-der { fill: #22c55e; }
      .eje-v-izq, .eje-h-izq, .eje-a-izq { fill: #22c55e; stroke: #22c55e; }
      .eje-v-der, .eje-h-der, .eje-a-der { fill: #22c55e; stroke: #22c55e; }
      .axis-label { font-family: Arial, sans-serif; font-weight: 900; font-size: 11px; fill: #0f172a; }
      .card-bg { fill: #0f172a; stroke: #334155; stroke-width: 1.5px; rx: 6px; }
      .card-title { font-family: Arial, sans-serif; font-weight: 900; font-size: 11px; fill: #94a3b8; }
      .card-value { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 12px; fill: #f8fafc; }
      .card-unit { font-family: Arial, sans-serif; font-size: 8px; fill: #64748b; }
      .skf-label { font-family: Arial, sans-serif; font-weight: 900; font-size: 15px; fill: #ffffff; text-anchor: middle; letter-spacing: 1.5px; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="20%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="motorBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="motorTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="steelBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="ringShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="couplingRedVeryDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a0e12"/>
      <stop offset="20%" stop-color="#5c1318"/>
      <stop offset="50%" stop-color="#2d080a"/>
      <stop offset="80%" stop-color="#1f0406"/>
      <stop offset="100%" stop-color="#0a0102"/>
    </linearGradient>
    <linearGradient id="hexBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <pattern id="baseGridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 0 M 0 0 L 20 20" stroke="#475569" stroke-width="1.2" opacity="0.35"/>
      <line x1="0" y1="10" x2="20" y2="10" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/>
    </pattern>
    <pattern id="ventPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#1e293b"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="10" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <filter id="glowText">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGrad)"/>

  <!-- BANCADA -->
  <g id="bancada-base" filter="url(#shadow)">
    <rect x="50" y="480" width="1100" height="40" rx="4" fill="#334155"/>
    <rect x="50" y="480" width="1100" height="40" rx="4" fill="url(#baseGridPattern)"/>
    <rect x="50" y="480" width="1100" height="8" fill="#94a3b8"/>
    <rect x="50" y="512" width="1100" height="8" fill="#1e293b"/>
  </g>

  <g id="eje-salida-der" filter="url(#shadow)">
    <rect x="880" y="326" width="120" height="48" fill="url(#shaftGrad)"/>
    <line x1="880" y1="334" x2="1000" y2="334" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  </g>

  <g id="motor-caja-principal" filter="url(#shadow)">
    <rect x="280" y="320" width="600" height="160" fill="url(#motorBodyGrad)" stroke="#1e293b" stroke-width="2"/>
    <path d="M 280 320 L 280 230 L 820 230 L 880 270 L 880 320 Z" fill="url(#motorTopGrad)" stroke="#1e293b" stroke-width="2"/>
    <line x1="280" y1="320" x2="880" y2="320" stroke="#1e293b" stroke-width="3"/>
    <rect x="350" y="340" width="55" height="35" fill="#475569" stroke="#0f172a" stroke-width="1.5" rx="2"/>
    <rect x="350" y="390" width="55" height="35" fill="#475569" stroke="#0f172a" stroke-width="1.5" rx="2"/>
    <rect x="430" y="345" width="90" height="80" fill="#334155" stroke="#0f172a" stroke-width="1.5" rx="2"/>
    <rect x="735" y="350" width="40" height="65" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="741" y="355" width="28" height="55" rx="6" fill="#38bdf8" opacity="0.25"/>
    <rect x="740" y="240" width="75" height="25" fill="url(#ventPattern)" stroke="#334155" stroke-width="1"/>
    <rect x="580" y="328" width="80" height="20" fill="#d97706" stroke="#b45309" stroke-width="1" rx="2"/>
    <text x="620" y="342" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">MENZEL</text>
    <rect x="430" y="315" width="20" height="8" fill="#1e293b" rx="2"/>
    <rect x="620" y="315" width="20" height="8" fill="#1e293b" rx="2"/>
    <rect x="760" y="315" width="20" height="8" fill="#1e293b" rx="2"/>
    <rect x="290" y="450" width="60" height="30" fill="#0f172a"/>
    <rect x="760" y="450" width="60" height="30" fill="#0f172a"/>
    <circle cx="320" cy="465" r="5" fill="url(#hexBolt)"/>
    <circle cx="790" cy="465" r="5" fill="url(#hexBolt)"/>
  </g>

  <!-- RODAMIENTO IZQUIERDO -->
  <g id="rodamiento-izquierdo" filter="url(#shadow)">
    <!-- Capa base que cambia de color -->
    <rect id="rod-izq-base" x="280" y="275" width="60" height="150" rx="10" class="chumacera-izq" stroke="#0f172a" stroke-width="2"/>
    <!-- Capa de brillo semitransparente (no bloquea el color) -->
    <rect x="280" y="275" width="60" height="150" rx="10" fill="url(#ringShine)" pointer-events="none"/>
    <rect x="280" y="275" width="60" height="8" fill="url(#steelBright)" opacity="0.8"/>
    <rect x="280" y="417" width="60" height="8" fill="url(#steelBright)" opacity="0.8"/>
    <line x1="284" y1="283" x2="284" y2="417" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="336" y1="283" x2="336" y2="417" stroke="#000000" stroke-width="2" opacity="0.4"/>
    <text x="310" y="355" class="skf-label" filter="url(#glowText)">SKF</text>
  </g>

  <!-- RODAMIENTO DERECHO -->
  <g id="rodamiento-derecho" filter="url(#shadow)">
    <rect id="rod-der-base" x="820" y="275" width="60" height="150" rx="10" class="chumacera-der" stroke="#0f172a" stroke-width="2"/>
    <rect x="820" y="275" width="60" height="150" rx="10" fill="url(#ringShine)" pointer-events="none"/>
    <rect x="820" y="275" width="60" height="8" fill="url(#steelBright)" opacity="0.8"/>
    <rect x="820" y="417" width="60" height="8" fill="url(#steelBright)" opacity="0.8"/>
    <line x1="824" y1="283" x2="824" y2="417" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="876" y1="283" x2="876" y2="417" stroke="#000000" stroke-width="2" opacity="0.4"/>
    <text x="850" y="355" class="skf-label" filter="url(#glowText)">SKF</text>
  </g>

  <g id="acoplamiento-derecha" filter="url(#shadow)">
    <rect x="1000" y="285" width="28" height="130" rx="4" fill="url(#couplingRedVeryDark)"/>
    <rect x="1028" y="270" width="20" height="160" rx="3" fill="url(#couplingRedVeryDark)"/>
    <rect x="1048" y="270" width="12" height="160" rx="1" fill="url(#steelBright)"/>
    <rect x="1060" y="270" width="20" height="160" rx="3" fill="url(#couplingRedVeryDark)"/>
    <rect x="1080" y="285" width="28" height="130" rx="4" fill="url(#couplingRedVeryDark)"/>
  </g>

  <!-- TARJETAS SCADA IZQUIERDA -->
  <g id="tarjetas-scada-izq" transform="translate(190, 25)">
    <g transform="translate(0,0)">
      <rect class="card-bg" width="56" height="42" rx="6"/>
      <text x="8" y="14" class="card-title">H</text>
      <circle cx="46" cy="10" r="4" class="eje-h-izq"/>
      <text x="8" y="30" class="card-value" inkscape:label="{&quot;attr&quot;:&quot;get&quot;,&quot;tag&quot;:&quot;@1&quot;,&quot;type&quot;:&quot;Good&quot;}"><tspan>%.2f</tspan></text>
      <text x="36" y="38" class="card-unit">mm/s</text>
    </g>
    <g transform="translate(62,0)">
      <rect class="card-bg" width="56" height="42" rx="6"/>
      <text x="8" y="14" class="card-title">V</text>
      <circle cx="46" cy="10" r="4" class="eje-v-izq"/>
      <text x="8" y="30" class="card-value" inkscape:label="{&quot;attr&quot;:&quot;get&quot;,&quot;tag&quot;:&quot;@2&quot;,&quot;type&quot;:&quot;Good&quot;}"><tspan>%.2f</tspan></text>
      <text x="36" y="38" class="card-unit">mm/s</text>
    </g>
    <g transform="translate(124,0)">
      <rect class="card-bg" width="56" height="42" rx="6"/>
      <text x="8" y="14" class="card-title">A</text>
      <circle cx="46" cy="10" r="4" class="eje-a-izq"/>
      <text x="8" y="30" class="card-value" inkscape:label="{&quot;attr&quot;:&quot;get&quot;,&quot;tag&quot;:&quot;@3&quot;,&quot;type&quot;:&quot;Good&quot;}"><tspan>%.2f</tspan></text>
      <text x="36" y="38" class="card-unit">mm/s</text>
    </g>
    <g id="ejes-iso-izq" transform="translate(120, 120)">
      <line x1="0" y1="0" x2="0" y2="-28" class="eje-v-izq" stroke-width="3.5"/>
      <polygon points="0,-35 -4,-26 4,-26" class="eje-v-izq"/>
      <text x="6" y="-30" class="axis-label">V</text>
      <line x1="0" y1="0" x2="24" y2="14" class="eje-h-izq" stroke-width="3.5"/>
      <polygon points="30,18 20,12 24,20" class="eje-h-izq"/>
      <text x="35" y="22" class="axis-label">H</text>
      <line x1="0" y1="0" x2="-24" y2="14" class="eje-a-izq" stroke-width="3.5"/>
      <polygon points="-30,18 -24,20 -20,12" class="eje-a-izq"/>
      <text x="-43" y="22" class="axis-label">A</text>
      <circle cx="0" cy="0" r="3.5" fill="#0f172a"/>
    </g>
  </g>

  <!-- TARJETAS SCADA DERECHA -->
  <g id="tarjetas-scada-der" transform="translate(800, 25)">
    <g transform="translate(0,0)">
      <rect class="card-bg" width="56" height="42" rx="6"/>
      <text x="8" y="14" class="card-title">H</text>
      <circle cx="46" cy="10" r="4" class="eje-h-der"/>
      <text x="8" y="30" class="card-value" inkscape:label="{&quot;attr&quot;:&quot;get&quot;,&quot;tag&quot;:&quot;@4&quot;,&quot;type&quot;:&quot;Good&quot;}"><tspan>%.2f</tspan></text>
      <text x="36" y="38" class="card-unit">mm/s</text>
    </g>
    <g transform="translate(62,0)">
      <rect class="card-bg" width="56" height="42" rx="6"/>
      <text x="8" y="14" class="card-title">V</text>
      <circle cx="46" cy="10" r="4" class="eje-v-der"/>
      <text x="8" y="30" class="card-value" inkscape:label="{&quot;attr&quot;:&quot;get&quot;,&quot;tag&quot;:&quot;@5&quot;,&quot;type&quot;:&quot;Good&quot;}"><tspan>%.2f</tspan></text>
      <text x="36" y="38" class="card-unit">mm/s</text>
    </g>
    <g transform="translate(124,0)">
      <rect class="card-bg" width="56" height="42" rx="6"/>
      <text x="8" y="14" class="card-title">A</text>
      <circle cx="46" cy="10" r="4" class="eje-a-der"/>
      <text x="8" y="30" class="card-value" inkscape:label="{&quot;attr&quot;:&quot;get&quot;,&quot;tag&quot;:&quot;@6&quot;,&quot;type&quot;:&quot;Good&quot;}"><tspan>%.2f</tspan></text>
      <text x="36" y="38" class="card-unit">mm/s</text>
    </g>
    <g id="ejes-iso-der" transform="translate(50, 120)">
      <line x1="0" y1="0" x2="0" y2="-28" class="eje-v-der" stroke-width="3.5"/>
      <polygon points="0,-35 -4,-26 4,-26" class="eje-v-der"/>
      <text x="6" y="-30" class="axis-label">V</text>
      <line x1="0" y1="0" x2="24" y2="14" class="eje-h-der" stroke-width="3.5"/>
      <polygon points="30,18 20,12 24,20" class="eje-h-der"/>
      <text x="35" y="22" class="axis-label">H</text>
      <line x1="0" y1="0" x2="-24" y2="14" class="eje-a-der" stroke-width="3.5"/>
      <polygon points="-30,18 -24,20 -20,12" class="eje-a-der"/>
      <text x="-43" y="22" class="axis-label">A</text>
      <circle cx="0" cy="0" r="3.5" fill="#0f172a"/>
    </g>
  </g>

  <!-- SCRIPT DE CONTROL (Lógica idéntica al contraeje y molino) -->
  <rect x="0" y="0" width="0" height="0"
        inkscape:label="{&quot;attr&quot;:&quot;set&quot;,&quot;src&quot;:&quot;var h1=parseFloat($V('@1'))||0; var v1=parseFloat($V('@2'))||0; var a1=parseFloat($V('@3'))||0; var h2=parseFloat($V('@4'))||0; var v2=parseFloat($V('@5'))||0; var a2=parseFloat($V('@6'))||0; function g(v){if(v&lt;4)return '#22c55e'; if(v&lt;6)return '#eab308'; if(v&lt;8)return '#f97316'; return '#ef4444';} var m1=Math.max(v1,h1,a1); var m2=Math.max(v2,h2,a2); document.getElementById('rod-izq-base').style.fill=g(m1); document.getElementById('rod-der-base').style.fill=g(m2); document.querySelectorAll('.eje-v-izq').forEach(el=&gt;{el.style.fill=g(v1); el.style.stroke=g(v1);}); document.querySelectorAll('.eje-h-izq').forEach(el=&gt;{el.style.fill=g(h1); el.style.stroke=g(h1);}); document.querySelectorAll('.eje-a-izq').forEach(el=&gt;{el.style.fill=g(a1); el.style.stroke=g(a1);}); document.querySelectorAll('.eje-v-der').forEach(el=&gt;{el.style.fill=g(v2); el.style.stroke=g(v2);}); document.querySelectorAll('.eje-h-der').forEach(el=&gt;{el.style.fill=g(h2); el.style.stroke=g(h2);}); document.querySelectorAll('.eje-a-der').forEach(el=&gt;{el.style.fill=g(a2); el.style.stroke=g(a2);});&quot;,&quot;tag&quot;:&quot;#exec_on_update&quot;,&quot;type&quot;:&quot;Data&quot;}"/>
</svg>