<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f1f5f9; }
      .gpu-layer { will-change: transform, opacity; transform: translateZ(0); }
      
      /* ----- PERNOS: ciclo continuo de abajo hacia arriba ----- */
      @keyframes boltRiseUp {
        0%   { transform: translateY(80px); opacity: 0; }
        15%  { opacity: 1; }
        85%  { opacity: 1; }
        100% { transform: translateY(-80px); opacity: 0; }
      }
      .bolt-r1 { animation: boltRiseUp 3.2s linear infinite; }
      .bolt-r2 { animation: boltRiseUp 3.2s linear infinite -0.4s; }
      .bolt-r3 { animation: boltRiseUp 3.2s linear infinite -0.8s; }
      .bolt-r4 { animation: boltRiseUp 3.2s linear infinite -1.2s; }
      .bolt-r5 { animation: boltRiseUp 3.2s linear infinite -1.6s; }
      .bolt-r6 { animation: boltRiseUp 3.2s linear infinite -2.0s; }
      .bolt-r7 { animation: boltRiseUp 3.2s linear infinite -2.4s; }
      .bolt-r8 { animation: boltRiseUp 3.2s linear infinite -2.8s; }

      /* ----- CORONA GRANDE: dientes SUBEN ----- */
      @keyframes gearTeethUp {
        0%   { transform: translateY(0px); }
        100% { transform: translateY(-30px); }
      }
      .gear-teeth-up { animation: gearTeethUp 0.35s linear infinite; }

      /* ----- PIÑÓN PEQUEÑO: dientes BAJAN (inverso) ----- */
      @keyframes gearTeethDown {
        0%   { transform: translateY(-30px); }
        100% { transform: translateY(0px); }
      }
      .gear-teeth-down { animation: gearTeethDown 0.35s linear infinite; }

      /* ----- EFECTOS FÍSICOS: micro-vibración motor/reductor ----- */
      @keyframes motorVibration {
        0%, 100% { transform: translateY(0px); }
        25%      { transform: translateY(-0.6px); }
        75%      { transform: translateY(0.6px); }
      }
      .vibrating-unit { animation: motorVibration 0.08s linear infinite; }

      /* ----- LED de operación (pulso) ----- */
      @keyframes statusPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.3; }
      }
      .status-led { animation: statusPulse 1.2s ease-in-out infinite; }

      /* ----- Cuando el SVG tiene la clase .stopped, todo se congela ----- */
      .stopped .bolt-r1,
      .stopped .bolt-r2,
      .stopped .bolt-r3,
      .stopped .bolt-r4,
      .stopped .bolt-r5,
      .stopped .bolt-r6,
      .stopped .bolt-r7,
      .stopped .bolt-r8 {
        animation-play-state: paused !important;
      }
      .stopped .gear-teeth-up,
      .stopped .gear-teeth-down {
        animation-play-state: paused !important;
      }
      .stopped .vibrating-unit {
        animation-play-state: paused !important;
      }
      .stopped .status-led {
        animation-play-state: paused !important;
      }
    </style>

    <!-- ----- PATRÓN DE DIENTES LOW-POLY TÉCNICO ----- -->
    <pattern id="gearTeethPatternLowPoly" width="35" height="30" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="35" height="15" fill="#1e293b" />
      <polygon points="2,15 33,15 33,28 2,28" fill="#d97706" />
      <polygon points="2,15 18,15 18,28 2,28" fill="#f59e0b" />
      <polygon points="2,15 33,15 18,19" fill="#fef08a" opacity="0.9"/>
    </pattern>

    <!-- ----- GRADIENTE DEL CILINDRO (verde operativo) ----- -->
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#86efac" />
      <stop offset="20%"  stop-color="#4ade80" />
      <stop offset="50%"  stop-color="#22c55e" />
      <stop offset="80%"  stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- ----- MÁSCARAS DE RECORTE ----- -->
    <clipPath id="cylinderClip">
      <rect x="420" y="180" width="440" height="160" rx="2"/>
    </clipPath>
    <clipPath id="gearMajorClip">
      <rect x="375" y="150" width="35" height="200" rx="2"/>
    </clipPath>
    <clipPath id="gearPinionClip">
      <rect x="375" y="348" width="35" height="65" rx="2"/>
    </clipPath>

    <!-- ----- GRUPO BASE DE PERNOS (se repite) ----- -->
    <g id="boltRowGroup">
      <circle cx="440" cy="260" r="4.5" fill="#f1f5f9" stroke="#334155" stroke-width="0.5"/>
      <circle cx="480" cy="260" r="4.5" fill="#f1f5f9" stroke="#334155" stroke-width="0.5"/>
      <circle cx="520" cy="260" r="4.5" fill="#f1f5f9" stroke="#334155" stroke-width="0.5"/>
      <circle cx="560" cy="260" r="4.5" fill="#f1f5f9" stroke="#334155" stroke-width="0.5"/>
      <circle cx="600" cy="260" r="4.5" fill="#f1f5f9" stroke="#334155" stroke-width="0.5"/>
      <circle cx="640" cy="260" r="4.5" fill="#f1f5f9" stroke="#334155" stroke-width="0.5"/>
      <circle cx="680" cy="260" r="4.5" fill="#f1f5f9" stroke="#334155" stroke-width="0.5"/>
      <circle cx="720" cy="260" r="4.5" fill="#f1f5f9" stroke="#334155" stroke-width="0.5"/>
      <circle cx="760" cy="260" r="4.5" fill="#f1f5f9" stroke="#334155" stroke-width="0.5"/>
      <circle cx="800" cy="260" r="4.5" fill="#f1f5f9" stroke="#334155" stroke-width="0.5"/>
      <circle cx="840" cy="260" r="4.5" fill="#f1f5f9" stroke="#334155" stroke-width="0.5"/>
    </g>
  </defs>

  <!-- ====== FONDO ====== -->
  <rect class="bg" width="1000" height="600" />
  <path d="M 0,470 L 1000,470" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,4" />

  <!-- ====== SOMBRAS PROYECTADAS (efecto de anclaje) ====== -->
  <g opacity="0.35">
    <ellipse cx="190" cy="472" rx="160" ry="8" fill="#0f172a" />
    <ellipse cx="370" cy="472" rx="45" ry="6" fill="#0f172a" />
    <ellipse cx="640" cy="472" rx="300" ry="10" fill="#0f172a" />
  </g>

  <!-- ====== CIMENTACIÓN Y BANCADAS ====== -->
  <g>
    <polygon points="30,465 970,465 970,475 30,475" fill="#334155" />
    <polygon points="30,465 970,465 970,467 30,467" fill="#94a3b8" />
    <polygon points="45,425 325,425 340,465 30,465" fill="#475569" />
    <polygon points="45,425 325,425 325,428 45,428" fill="#cbd5e1" />
    <rect x="55" y="452" width="10" height="13" fill="#1e293b" rx="1" />
    <rect x="310" y="452" width="10" height="13" fill="#1e293b" rx="1" />
    <polygon points="340,435 410,435 415,465 335,465" fill="#334155" />
    <polygon points="340,435 410,435 410,437 340,437" fill="#64748b" />
    <polygon points="325,325 415,325 405,465 335,465" fill="#1e293b" />
    <polygon points="325,325 415,325 410,330 330,330" fill="#64748b" />
    <polygon points="845,325 935,325 925,465 855,465" fill="#1e293b" />
    <polygon points="845,325 935,325 930,330 850,330" fill="#64748b" />
  </g>

  <!-- ====== UNIDAD DE ACCIONAMIENTO (MOTOR + REDUCTOR) ====== -->
  <g class="vibrating-unit" id="vibrating-unit">
    <!-- Motor -->
    <g>
      <polygon points="55,412 145,412 140,425 60,425" fill="#1e3a8a" />
      <polygon points="55,412 145,412 145,414 55,414" fill="#60a5fa" />
      <polygon points="60,345 140,345 150,375 140,412 60,412 50,375" fill="#2563eb" />
      <polygon points="60,345 140,345 150,375 60,375" fill="#3b82f6" />
      <polygon points="60,375 150,375 140,412 60,412" fill="#1d4ed8" />
      <polygon points="60,345 140,345 138,348 62,348" fill="#93c5fd" />
      <path d="M 72,345 L 72,412 M 86,345 L 86,412 M 100,345 L 100,412 M 114,345 L 114,412 M 128,345 L 128,412" stroke="#60a5fa" stroke-width="3" />
      <path d="M 72,375 L 72,412 M 86,375 L 86,412 M 100,375 L 100,412 M 114,375 L 114,412 M 128,375 L 128,412" stroke="#1e40af" stroke-width="2" />
      <polygon points="85,326 120,326 125,345 80,345" fill="#93c5fd" />
      <polygon points="85,326 120,326 122,330 83,330" fill="#ffffff" />
      <polygon points="48,352 60,345 60,412 48,405" fill="#0f172a" />
      <circle cx="100" cy="322" r="3.5" fill="none" stroke="#93c5fd" stroke-width="1.5" />
    </g>
    <!-- Eje 1 -->
    <polygon points="150,370 190,370 190,380 150,380" fill="#cbd5e1" />
    <polygon points="150,370 190,370 190,373 150,373" fill="#ffffff" />
    <polygon points="162,360 178,360 178,390 162,390" fill="#0f172a" />
    <polygon points="162,360 178,360 178,364 162,364" fill="#475569" />
    <circle cx="170" cy="375" r="2" fill="#facc15" />
    <!-- Reductor -->
    <g>
      <polygon points="190,320 275,320 295,350 295,425 190,425" fill="#475569" />
      <polygon points="190,320 275,320 295,350 190,350" fill="#64748b" />
      <polygon points="190,350 295,350 295,425 190,425" fill="#334155" />
      <polygon points="190,320 275,320 273,323 192,323" fill="#94a3b8" />
      <polygon points="180,420 305,420 300,428 185,428" fill="#1e293b" />
      <polygon points="200,312 255,312 260,320 195,320" fill="#94a3b8" />
      <circle cx="210" cy="316" r="1" fill="#0f172a" />
      <circle cx="245" cy="316" r="1" fill="#0f172a" />
      <polygon points="250,360 280,360 285,390 255,390" fill="#1e293b" />
      <polygon points="250,360 280,360 280,364 250,364" fill="#64748b" />
      <circle cx="215" cy="390" r="5" fill="#facc15" />
      <!-- LED status -->
      <circle class="status-led" id="status-led" cx="280" cy="335" r="3" fill="#22c55e" />
    </g>
    <!-- Eje 2 -->
    <polygon points="295,370 375,370 375,380 295,380" fill="#cbd5e1" />
    <polygon points="295,370 375,370 375,373 295,373" fill="#ffffff" />
  </g>

  <!-- ====== PIÑÓN (dientes BAJAN) ====== -->
  <rect x="375" y="348" width="35" height="65" fill="#b45309" rx="1"/>
  <g clip-path="url(#gearPinionClip)">
    <g class="gear-teeth-down" id="pinon-dientes">
      <rect x="375" y="320" width="35" height="120" fill="url(#gearTeethPatternLowPoly)" />
    </g>
  </g>

  <!-- ====== CORONA (dientes SUBEN) ====== -->
  <rect x="375" y="150" width="35" height="200" fill="#b45309" rx="1"/>
  <g clip-path="url(#gearMajorClip)">
    <g class="gear-teeth-up" id="corona-dientes">
      <rect x="375" y="120" width="35" height="260" fill="url(#gearTeethPatternLowPoly)" />
    </g>
  </g>

  <!-- ====== INTRODUCCIÓN DE ENGRANAJE (sombra de contacto) ====== -->
  <polygon points="371,345 414,345 410,350 375,350" fill="#0f172a" opacity="0.85"/>

  <!-- ====== CHUMACERAS DE MUÑONES ====== -->
  <g>
    <polygon points="330,240 365,248 365,272 330,280" fill="#94a3b8" />
    <polygon points="335,230 370,230 370,282 335,282" fill="#475569" />
    <polygon points="335,230 370,230 370,256 335,256" fill="#64748b" />
    <rect x="335" y="255" width="35" height="3" fill="#0f172a" />
    <polygon points="865,248 900,240 900,280 865,272" fill="#94a3b8" />
    <polygon points="865,230 900,230 900,282 865,282" fill="#475569" />
    <polygon points="865,230 900,230 900,256 865,256" fill="#64748b" />
    <rect x="865" y="255" width="35" height="3" fill="#0f172a" />
  </g>

  <!-- ====== CILINDRO PRINCIPAL (con ID para control dinámico) ====== -->
  <g id="molino-body-group">
    <rect x="420" y="180" width="440" height="160" rx="2" fill="#64748b" />
    <rect x="410" y="180" width="10" height="160" fill="#1e293b" rx="1" />
    <rect x="860" y="180" width="10" height="160" fill="#1e293b" rx="1" />

    <!-- Cuerpo que cambiará de color (operativo verde / detenido rojo) -->
    <rect id="molino-body" x="420" y="180" width="440" height="160" rx="2" fill="url(#cylinderGrad)" stroke="#14532d" stroke-width="2" />

    <!-- Pernos animados -->
    <g clip-path="url(#cylinderClip)">
      <g id="pernos">
        <use href="#boltRowGroup" class="bolt-r1" />
        <use href="#boltRowGroup" class="bolt-r2" />
        <use href="#boltRowGroup" class="bolt-r3" />
        <use href="#boltRowGroup" class="bolt-r4" />
        <use href="#boltRowGroup" class="bolt-r5" />
        <use href="#boltRowGroup" class="bolt-r6" />
        <use href="#boltRowGroup" class="bolt-r7" />
        <use href="#boltRowGroup" class="bolt-r8" />
      </g>
    </g>

    <!-- Facetas de iluminación (fijas) -->
    <polygon points="420,180 860,180 860,215 420,215" fill="#ffffff" opacity="0.22" clip-path="url(#cylinderClip)"/>
    <polygon points="420,215 860,215 860,285 420,285" fill="#cbd5e1" opacity="0.1" clip-path="url(#cylinderClip)"/>
    <polygon points="420,300 860,300 860,340 420,340" fill="#0f172a" opacity="0.3" clip-path="url(#cylinderClip)"/>
  </g>

  <!-- ====== PANEL SCADA (Tonelaje) ====== -->
  <g transform="translate(580, 150)">
    <rect x="-100" y="-35" width="200" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
    <text x="0" y="-10" text-anchor="middle" fill="#64748b" font-size="11" font-family="system-ui, sans-serif" font-weight="600">TONELAJE ACTUAL</text>
    <text x="0" y="18" text-anchor="middle" font-family="system-ui, -apple-system, monospace"
          font-size="20" font-weight="800" fill="#059669"
          inkscape:label="{&quot;attr&quot;:&quot;get&quot;,&quot;tag&quot;:&quot;@1&quot;,&quot;type&quot;:&quot;Good&quot;}"
          xml:space="preserve">
      <tspan x="0" y="18">--.-</tspan>
      <tspan font-size="13" fill="#64748b" font-weight="400"> t/h</tspan>
    </text>
  </g>

  <!-- ====== SCRIPT DE CONTROL DINÁMICO (usado por Grafana) ====== -->
  <!-- Este rect invisible ejecuta el código cuando el tag @1 cambia -->
  <rect x="0" y="0" width="0" height="0"
        inkscape:label="{&quot;attr&quot;:&quot;set&quot;,&quot;src&quot;:&quot;var t = $V(\&quot;@1\&quot;); var svg = document.querySelector(\&quot;svg\&quot;); var body = d3.select(\&quot;#molino-body\&quot;); var pernos = d3.select(\&quot;#pernos\&quot;); var corona = d3.select(\&quot;#corona-dientes\&quot;); var pinon = d3.select(\&quot;#pinon-dientes\&quot;); var vibrar = d3.select(\&quot;#vibrating-unit\&quot;); var led = d3.select(\&quot;#status-led\&quot;); if (t &gt; 0) { svg.classList.remove(\&quot;stopped\&quot;); body.style(\&quot;fill\&quot;, \&quot;url(#cylinderGrad)\&quot;); body.style(\&quot;stroke\&quot;, \&quot;#14532d\&quot;); pernos.style(\&quot;display\&quot;, \&quot;block\&quot;); corona.style(\&quot;display\&quot;, \&quot;block\&quot;); pinon.style(\&quot;display\&quot;, \&quot;block\&quot;); } else { svg.classList.add(\&quot;stopped\&quot;); body.style(\&quot;fill\&quot;, \&quot;#dc2626\&quot;); body.style(\&quot;stroke\&quot;, \&quot;#7f1d1d\&quot;); pernos.style(\&quot;display\&quot;, \&quot;none\&quot;); corona.style(\&quot;display\&quot;, \&quot;none\&quot;); pinon.style(\&quot;display\&quot;, \&quot;none\&quot;); }&quot;,&quot;tag&quot;:&quot;#exec_on_update&quot;,&quot;type&quot;:&quot;Data&quot;}" />
</svg>